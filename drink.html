<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRINK | BUONO</title>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="menu-page">
      <a href="index.html" class="menu-page__home">HOME</a>

      <h1 class="menu-page__title">DRINK</h1>

      <section class="menu-page__section">
        <h2 class="menu-page__heading">DRINK MENU</h2>

        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_drink_01.webp" alt="赤ワイン" />
            <h3>ROSSO</h3>
            <p>果実味とコクを楽しめる<br>イタリア産赤ワイン。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_drink_02.webp" alt="白ワイン" />
            <h3>BIANCO</h3>
            <p>爽やかな酸味と香りが魅力の<br>イタリア産白ワイン。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_drink_03.webp" alt="スパークリングワイン" />
            <h3>SPUMANTE</h3>
            <p>華やかな香りと泡立ちの<br>スパークリング。</p>
          </article>
        </div>
      </section>

      <section class="menu-page__section menu-page__section--other">
        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_drink_04.webp" alt="カクテル" />
            <h3>COCKTAIL</h3>
            <p>カンパリオレンジ</p>
            <p>オレンジの甘酸っぱさを<br>楽しむカクテル。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_drink_05.webp" alt="ソフトドリンク" />
            <h3>SOFT DRINK</h3>
            <p>グァバジュース</p>
            <p>南国フルーツならではの<br>優しい甘さと豊かな香り。</p>
          </article>
          <article class="menu-page__item">
            <img src="images/link_drink_06.webp" alt="紅茶" />
            <h3>TEA</h3>
            <p>アールグレイ</p>
            <p>華やかな香りが広がる<br>アールグレイ。</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
