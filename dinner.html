<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <title>DINNER | BUONO</title>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="menu-page">
      <a href="index.html" class="menu-page__home">HOME</a>

      <h1 class="menu-page__title">DINNER</h1>

      <section class="menu-page__section">
        <h2 class="menu-page__heading">DINNER SET</h2>

        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_dinner_01.webp" alt="スタンダードコース" />
            <h3>A. STANDARD COURSE</h3>
            <p>前菜・パスタ・メインを楽しむ<br>定番コース。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_dinner_02.webp" alt="スペシャルコース" />
            <h3>B. SPECIAL COURSE</h3>
            <p>旬の食材を味わう<br>贅沢なコース。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_dinner_03.webp" alt="シェフズコース" />
            <h3>C. CHEF’S COURSE</h3>
            <p>シェフ厳選の食材を使った<br>特別コース。</p>
          </article>
        </div>
      </section>

      <section class="menu-page__section menu-page__section--other">
        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_dinner_04.webp" alt="パスタ" />
            <h3>PASTA </h3>
            <p>牛肉のボロネーゼ</p>
            <p>牛肉の旨みが広がる<br>濃厚ボロネーゼ。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_dinner_05.webp" alt="ピザ" />
            <h3>PIZZA</h3>
            <p>クアトロフォルマッジ</p>
            <p>４種のチーズを楽しむ<br>濃厚ピッツァ。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_dinner_06.webp" alt="デザート" />
            <h3>A LA CARTA</h3>
            <p>牛肉の赤ワイン煮込み</p>
            <p>赤ワインでじっくり煮込んだ一皿</p>
          </article>
        </div>
      </section>
