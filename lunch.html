<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body>
    <main class="menu-page">
      <a href="index.html" class="menu-page__home">HOME</a>

      <h1 class="menu-page__title">LUNCH</h1>

      <section class="menu-page__section">
        <h2 class="menu-page__heading">LUNCH SET</h2>

        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_lunch_01.webp" alt="パスタランチセット" />
            <h3>A. BUONO PASTA SET</h3>
            <p>本日のパスタ・前菜・サラダ・パン<br />BUONO定番のランチセット。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_lunch_02.webp" alt="ピザランチセット" />

            <p>ピッツァをメインに<br />サラダとスープを楽しめるセット。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_lunch_03.webp" alt="スペシャルランチセット" />

            <p>パスタとメイン料理が楽しめる<br />贅沢なランチセット。</p>
          </article>
        </div>

      <section class="menu-page__section menu-page__section--other">
        <div class="menu-page__grid">
          <article class="menu-page__item">
            <img src="images/link_lunch_04.webp" alt="パスタ" />
            <h3>PASTA</h3>
            <p>エビとトマトのクリームパスタ</p>
            <p>海老とトマト旨み広がる<br />濃厚クリームパスタ。</p>
          </article>

            <img src="images/link_lunch_05.webp" alt="ピザ" />
            <h3>PIZZA</h3>
            <p>マルゲリータ</p>
            <p>3種のチーズを使った<br />シンプルな王道ピッツァ。</p>
          </article>

          <article class="menu-page__item">
            <img src="images/link_lunch_06.webp" alt="デザート" />
            <h3>DESSERT</h3>
            <p>自家製ティラミス</p>
            <p>コクとほろ苦さの定番ドルチェ。</p>
          </article>
